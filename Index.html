<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem APAR Fix 23</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f4f4f4; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 80%; max-width: 300px; text-align: center; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-petugas { background: #e53e3e; color: white; }
        .btn-tenant { background: #2b6cb0; color: white; }
    </style>
</head>
<body>

<div class="box">
    <h2>Sistem APAR</h2>
    
    <!-- Tombol Petugas: Menuju halaman login/scan -->
    <button class="btn-petugas" onclick="window.location.href='admin.html'">Masuk sebagai Petugas/Admin</button>
    
    <!-- Tombol Tenant: Menuju halaman publik -->
    <button class="btn-tenant" onclick="aksesTenant()">Lihat Status APAR (Tenant)</button>
</div>

<script>
    function aksesTenant() {
        const nama = prompt("Masukkan Nama Anda:");
        const hp = prompt("Masukkan Nomor HP:");
        if (nama && hp) {
            // Logika menyimpan data tamu ke Supabase bisa ditambahkan di sini
            window.location.href = 'tenant.html'; 
        } else {
            alert("Nama dan Nomor HP wajib diisi!");
        }
    }
</script>

</body>
</html>
