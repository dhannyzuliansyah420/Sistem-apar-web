<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proses Scan APAR</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .loading { color: #555; }
        .success { color: #38a169; }
    </style>
</head>
<body>
    <div id="status" class="loading">Memproses data... Mohon tunggu.</div>

    <script>
        // 1. Ambil ID APAR dari URL (misal: scan.html?id=APAR-001)
        const urlParams = new URLSearchParams(window.location.search);
        const idApar = urlParams.get('id');

        // 2. Eksekusi otomatis ambil lokasi GPS
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const gps = pos.coords.latitude + "," + pos.coords.longitude;
            
            // 3. Update database di Supabase
            // Ganti URL dan KEY dengan punya lu sendiri dari FASE 1
            const SUPABASE_URL = 'PASTE_PROJECT_URL_LU_DISINI';
            const SUPABASE_KEY = 'PASTE_ANON_KEY_LU_DISINI';

            const respon = await fetch(`${SUPABASE_URL}/rest/v1/master_apar?id_apar=eq.${idApar}`, {
                method: 'PATCH',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ 
                    status: 'Terscan', 
                    koordinat_gps: gps, 
                    waktu_scan: new Date().toISOString() 
                })
            });

            if(respon.ok) {
                document.getElementById("status").innerHTML = 
                    `<h1 class='success'>✅ SCAN BERHASIL</h1><p>APAR ${idApar} telah tercatat di lokasi: ${gps}</p>`;
            } else {
                document.getElementById("status").innerText = "Gagal mengirim data. Cek koneksi!";
            }
        }, () => {
            document.getElementById("status").innerText = "Gagal mendapatkan lokasi. Harap izinkan akses GPS di browser!";
        });
    </script>
</body>
</html>
